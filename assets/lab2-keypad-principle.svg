<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">How a 2 by 2 keypad is scanned</title>
  <desc id="desc">Each column has a pull-up resistor to 3.3 volts. R1 is driven low and R2 is a high-impedance input. Only key 1 at R1 C1 is pressed, connecting C1 to R1, so C1 reads zero and C2 reads one. Open switches disconnect their row and column. Arched crossings are not connected.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #24374b; }
    .title { font-size: 29px; font-weight: bold; }
    .head { font-size: 22px; font-weight: bold; }
    .body { font-size: 19px; }
    .small { font-size: 16px; }
    .wire { fill: none; stroke: #596a7a; stroke-width: 3; stroke-linejoin: round; }
    .low { stroke: #187d9a; }
    .lowtext { fill: #126c86; }
    .hightext { fill: #a34827; }
    .contact { fill: #fff; stroke: #596a7a; stroke-width: 3; }
  </style>
  <rect width="1080" height="760" rx="16" fill="#f6f8fc"/>
  <text x="34" y="47" class="title">2 × 2 keypad · scan one row at a time</text>
  <text x="34" y="78" class="body">Example: only key 1 is pressed. Drive R1 LOW; keep R2 as a high-impedance input.</text>

  <text x="590" y="119" text-anchor="middle" class="head hightext">3.3 V</text>
  <path d="M450 140 H730 M590 129 V140 M450 140 V163 M730 140 V163" class="wire"/>
  <circle cx="590" cy="140" r="4" fill="#596a7a"/>
  <rect x="438" y="163" width="24" height="53" rx="2" fill="#fff" stroke="#596a7a" stroke-width="3"/>
  <rect x="718" y="163" width="24" height="53" rx="2" fill="#fff" stroke="#596a7a" stroke-width="3"/>
  <text x="474" y="190" class="small">Pull-up</text>
  <text x="474" y="210" class="small">resistor</text>
  <text x="754" y="190" class="small">Pull-up</text>
  <text x="754" y="210" class="small">resistor</text>

  <rect x="265" y="276" width="577" height="302" rx="15" fill="#fff" stroke="#d6dfe8" stroke-dasharray="6 6"/>
  <text x="860" y="295" class="small">Keypad</text>
  <text x="860" y="315" class="small">switches</text>

  <!-- Horizontal row buses. Column buses arch over these without contact. -->
  <path d="M225 390 H814" class="wire low"/>
  <path d="M225 552 H814" class="wire"/>
  <text x="34" y="369" class="head lowtext">R1: output LOW</text>
  <text x="34" y="397" class="small">GPIO drives 0 V</text>
  <text x="34" y="526" class="head">R2: input / Hi-Z</text>
  <text x="34" y="552" class="small">Not driven HIGH or LOW</text>
  <circle cx="225" cy="390" r="5" fill="#187d9a"/>
  <circle cx="225" cy="552" r="5" fill="#596a7a"/>

  <!-- White underlay keeps the arch visibly separate from the row bus. -->
  <path d="M450 216 V378 Q473 390 450 402 V540 Q473 552 450 564 V574 M730 216 V378 Q753 390 730 402 V540 Q753 552 730 564 V574" fill="none" stroke="#fff" stroke-width="8"/>
  <path d="M450 216 V378 Q473 390 450 402 V540 Q473 552 450 564 V574" class="wire low"/>
  <path d="M730 216 V378 Q753 390 730 402 V540 Q753 552 730 564 V574" class="wire"/>
  <path d="M450 247 H343 M730 247 H859" class="wire"/>
  <circle cx="450" cy="247" r="4" fill="#187d9a"/>
  <circle cx="730" cy="247" r="4" fill="#596a7a"/>
  <text x="332" y="253" text-anchor="end" class="head lowtext">C1 input = 0</text>
  <text x="870" y="253" class="head hightext">C2 input = 1</text>

  <!-- Key 1 closes the R1 branch to C1. -->
  <path d="M320 390 V337 H450" class="wire low" stroke-width="4"/>
  <circle cx="320" cy="390" r="4" fill="#187d9a"/>
  <circle cx="450" cy="337" r="4" fill="#187d9a"/>
  <circle cx="346" cy="337" r="5" fill="#fff" stroke="#187d9a" stroke-width="3"/>
  <circle cx="397" cy="337" r="5" fill="#fff" stroke="#187d9a" stroke-width="3"/>
  <text x="320" y="310" class="body lowtext">1 · pressed</text>

  <!-- Other keys are open switches, not permanently wired crossings. -->
  <path d="M600 390 V337 H626 M677 337 H730 M626 337 L665 315" class="wire"/>
  <circle cx="600" cy="390" r="4" fill="#187d9a"/>
  <circle cx="730" cy="337" r="4" fill="#596a7a"/>
  <circle cx="626" cy="337" r="5" class="contact"/><circle cx="677" cy="337" r="5" class="contact"/>
  <text x="600" y="298" class="body">2 · released</text>

  <path d="M320 552 V499 H346 M397 499 H450 M346 499 L385 477" class="wire"/>
  <circle cx="320" cy="552" r="4" fill="#596a7a"/>
  <circle cx="450" cy="499" r="4" fill="#187d9a"/>
  <circle cx="346" cy="499" r="5" class="contact"/><circle cx="397" cy="499" r="5" class="contact"/>
  <text x="320" y="460" class="body">4 · released</text>

  <path d="M600 552 V499 H626 M677 499 H730 M626 499 L665 477" class="wire"/>
  <circle cx="600" cy="552" r="4" fill="#596a7a"/>
  <circle cx="730" cy="499" r="4" fill="#596a7a"/>
  <circle cx="626" cy="499" r="5" class="contact"/><circle cx="677" cy="499" r="5" class="contact"/>
  <text x="600" y="460" class="body">5 · released</text>

  <text x="34" y="613" class="small">● Joined wires     ∩ Crossing without connection     Hi-Z = high impedance</text>
  <rect x="28" y="635" width="1024" height="99" rx="12" fill="#e7eff6"/>
  <text x="47" y="664" class="body">Key 1 closes: C1 connects to LOW through R1. C2 stays HIGH through its pull-up.</text>
  <text x="47" y="691" class="body">Next scan: release R1 to input / Hi-Z, then drive R2 LOW and read both columns again.</text>
  <text x="47" y="716" class="small">Principle only: keys 1, 2, 4, 5 are a 2 × 2 subset of the lab keypad. No GPIO or breadboard positions are specified.</text>
</svg>
